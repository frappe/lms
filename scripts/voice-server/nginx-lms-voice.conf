# /etc/nginx/conf.d/10-lms-voice.conf on a server that already runs sites with nginx.
# certbot --nginx -d voice.example.com adds the certificate lines and the HTTPS redirect.
server {
	listen 80;
	listen [::]:80;
	server_name voice.example.com;

	client_max_body_size 30m;

	location / {
		proxy_pass http://127.0.0.1:8765;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_request_buffering off;
		# A ten minute piece of video can take a while to write down.
		proxy_read_timeout 1800s;
		proxy_send_timeout 1800s;
	}
}
