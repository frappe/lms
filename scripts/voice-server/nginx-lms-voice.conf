# /etc/nginx/conf.d/10-lms-voice.conf on a server that already runs sites with nginx.
# Replace voice.example.com with your name. Certificate, once the name resolves:
#   mkdir -p /var/www/letsencrypt
#   certbot certonly --webroot -w /var/www/letsencrypt -d voice.example.com
# and a renewal hook: printf '#!/bin/sh\nsystemctl reload nginx\n' > /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
server {
	listen 80;
	listen [::]:80;
	server_name voice.example.com;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/letsencrypt;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name voice.example.com;

	ssl_certificate /etc/letsencrypt/live/voice.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/voice.example.com/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;

	client_max_body_size 30m;

	location / {
		proxy_pass http://127.0.0.1:8765;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_request_buffering off;
		# A ten minute piece of video can take a while to write down.
		proxy_read_timeout 1800s;
		proxy_send_timeout 1800s;
	}
}
