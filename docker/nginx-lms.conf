server {
	server_name yu-lms.opik.net;

	client_max_body_size 100m;

	location /assets/ {
		alias /var/lib/docker/volumes/lms_frappe-bench/_data/sites/assets/;
		access_log off;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location /socket.io {
		proxy_pass http://127.0.0.1:9000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host lms.localhost;
		proxy_set_header X-Frappe-Site-Name lms.localhost;
		proxy_read_timeout 120s;
	}

	location / {
		proxy_pass http://127.0.0.1:8000;
		proxy_set_header Host lms.localhost;
		proxy_set_header X-Frappe-Site-Name lms.localhost;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
	}

	listen 443 ssl;
	listen [::]:443 ssl ipv6only=on;
	ssl_certificate /etc/letsencrypt/live/yu-lms.opik.net/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/yu-lms.opik.net/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name yu-lms.opik.net;
	return 301 https://$host$request_uri;
}
