pull_request_rules:
    - name: backport to develop
      conditions:
          - label="backport develop"
      actions:
          backport:
              # Without this Mergify commits conflict markers and opens a PR that fails CI.
              # With it, Mergify comments that the backport failed, and it is done by hand.
              ignore_conflicts: false
              branches:
                  - develop
              assignees:
                  - "{{ author }}"

    - name: backport to main-hotfix
      conditions:
          - label="backport main-hotfix"
      actions:
          backport:
              # Without this Mergify commits conflict markers and opens a PR that fails CI.
              # With it, Mergify comments that the backport failed, and it is done by hand.
              ignore_conflicts: false
              branches:
                  - main-hotfix
              assignees:
                  - "{{ author }}"

    - name: backport to main
      conditions:
          - label="backport main"
      actions:
          backport:
              # Without this Mergify commits conflict markers and opens a PR that fails CI.
              # With it, Mergify comments that the backport failed, and it is done by hand.
              ignore_conflicts: false
              branches:
                  - main
              assignees:
                  - "{{ author }}"

    - name: backport to version-15-hotfix
      conditions:
          - label="backport version-15-hotfix"
      actions:
          backport:
              # Without this Mergify commits conflict markers and opens a PR that fails CI.
              # With it, Mergify comments that the backport failed, and it is done by hand.
              ignore_conflicts: false
              branches:
                  - version-15-hotfix
              assignees:
                  - "{{ author }}"

    - name: backport to version-16-hotfix
      conditions:
          - label="backport version-16-hotfix"
      actions:
          backport:
              # Without this Mergify commits conflict markers and opens a PR that fails CI.
              # With it, Mergify comments that the backport failed, and it is done by hand.
              ignore_conflicts: false
              branches:
                  - version-16-hotfix
              assignees:
                  - "{{ author }}"

    - name: backport to all hotfix lines
      conditions:
          - label="backport all-hotfixes"
      actions:
          backport:
              # Without this Mergify commits conflict markers and opens a PR that fails CI.
              # With it, Mergify comments that the backport failed, and it is done by hand.
              ignore_conflicts: false
              branches:
                  - version-15-hotfix
                  - version-16-hotfix
              assignees:
                  - "{{ author }}"
