strictness = 2
comment_types = ["logic", "syntax"]
review_drafts = false
# develop and every release line that takes direct fixes or backports.
include_branches = ["develop", "main-hotfix", "main", "version-15-hotfix", "version-16-hotfix"]
disabled_labels = ["conflicts", "skip-guard"]
exclude_authors = ["mergify[bot]", "dependabot[bot]", "github-actions[bot]", "frappe-pr-bot"]
ignore_keywords = ["WIP", "[skip review]"]
ignore_patterns = [
	"yarn.lock",
	"**/yarn.lock",
	"lms/locale/*.po",
	"lms/locale/*.pot",
	"**/*.min.js",
	"**/*.min.css",
	"frontend/components.d.ts",
]
status_check = true
update_description = false

[sections.summary]
included = true
collapsible = true
default_open = false

[sections.issues_table]
included = false

[sections.diagram]
included = false
