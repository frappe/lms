name: UI Tests

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "lms/locale/**"
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - main-hotfix
    paths-ignore:
      - "**.md"
      - "lms/locale/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Do not change this as GITHUB_TOKEN is being used by roulette
  contents: read

jobs:
  test:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      mariadb:
        image: mariadb:10.8
        env:
          MARIADB_ROOT_PASSWORD: 123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      # Depth 2 keeps the PR base, the merge commit's first parent.
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select tests
        id: select
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'all-tests')
        run: |
          set -euo pipefail
          git diff --name-status --no-renames HEAD^1 HEAD \
            | .github/helper/changed-tests.sh e2e >> "$GITHUB_OUTPUT"

      - name: Add to Hosts
        run: echo "127.0.0.1 lms.test" | sudo tee -a /etc/hosts

      - uses: ./.github/actions/setup-bench
        with:
          site: lms.test
          db-root-password: "123"
          build-assets: "true"
          frappe-branch: version-16
          payments-branch: version-16
          site-config: >-
            {
              "allow_tests": true,
              "enable_ui_tests": true,
              "auto_email_id": "test@example.com",
              "mail_server": "smtp.example.com",
              "mail_login": "test@example.com",
              "mail_password": "test",
              "host_name": "http://lms.test:8000",
              "monitor": 1,
              "server_script_enabled": true,
              "mute_emails": true
            }

      - name: Site Setup
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site lms.test execute frappe.utils.install.complete_setup_wizard
          bench --site lms.test execute frappe.tests.ui_test_helpers.create_test_user
          bench --site lms.test set-password frappe@example.com admin
          bench --site lms.test execute lms.lms.utils.persona_captured

      - name: Start bench
        working-directory: /home/runner/frappe-bench
        run: |
          sed -i -e 's/^watch:/# watch:/' -e 's/^schedule:/# schedule:/' Procfile
          bench start &> bench_start.log &
          curl --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            --output /dev/null http://lms.test:8000/api/method/ping

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright browsers
        working-directory: /home/runner/frappe-bench/apps/lms
        run: npx playwright install --with-deps chromium

      - name: UI Tests
        working-directory: /home/runner/frappe-bench/apps/lms
        # SPECS is empty on a full run.
        run: |
          read -ra specs <<< "$SPECS"
          npx playwright test --project=setup --project=e2e "${specs[@]}"
        env:
          PLAYWRIGHT_BASE_URL: http://lms.test:8000
          CI: "true"
          SPECS: ${{ steps.select.outputs.tests }}

      - name: Upload Playwright results if tests fail
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            /home/runner/frappe-bench/apps/lms/test-results
            /home/runner/frappe-bench/apps/lms/playwright-report
          if-no-files-found: ignore

      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true
