name: Frontend Tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      # Read from disk by frontend/src/tests/ravenRuleModel.test.ts.
      - "lms/raven_provider.py"
      # Read from disk by frontend/src/tests/a11y-forms.test.ts.
      - "lms/www/new-sign-up.html"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches: [main, develop, main-hotfix]
    paths:
      - "frontend/**"
      - "package.json"
      # Read from disk by frontend/src/tests/ravenRuleModel.test.ts.
      - "lms/raven_provider.py"
      # Read from disk by frontend/src/tests/a11y-forms.test.ts.
      - "lms/www/new-sign-up.html"
      - ".github/workflows/frontend-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      # The bench layout, because frontend/package.json declares
      # `@framework/ui: link:../../frappe/ui` the way helpdesk and crm do. A
      # checkout at the workspace root resolves that link outside the workspace,
      # and vitest then fails with "Failed to resolve import
      # @framework/ui/ConditionBuilder", naming neither the link nor the cause.
      - uses: actions/checkout@v4
        with:
          path: apps/lms

      # Only the package the link points at. `develop`, because ConditionBuilder
      # is on no version-16 branch or v16 tag. It is bundled into the SPA at
      # build time, so this pins what LMS builds against, not what it runs on.
      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: develop
          path: apps/frappe
          sparse-checkout: ui

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: apps/lms/frontend/yarn.lock

      - name: Install dependencies
        working-directory: apps/lms/frontend
        run: yarn install --frozen-lockfile

      - name: Run vitest
        working-directory: apps/lms/frontend
        run: yarn test --run
