name: Server Tests
on:
  push:
    branches:
      - main
      - develop
      - main-hotfix
    # The frontend and Vue, TS, JS and CSS files are Vitest's and the UI
    # tests' business, except the one frontend file a server test reads.
    # Keep in step with is_ignored in .github/helper/changed-tests.sh.
    paths:
      - "**"
      - "!**.md"
      - "!lms/locale/**"
      - "!frontend/**"
      - "!**.vue"
      - "!**.ts"
      - "!**.js"
      - "!**.css"
      - "frontend/src/utils/lessonForm.ts"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!lms/locale/**"
      - "!frontend/**"
      - "!**.vue"
      - "!**.ts"
      - "!**.js"
      - "!**.css"
      - "frontend/src/utils/lessonForm.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      mariadb:
        image: anandology/mariadb-utf8mb4:10.3
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      # Depth 2 keeps the PR base, the merge commit's first parent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select tests
        id: select
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'all-tests')
        run: |
          set -euo pipefail
          git diff --name-status --no-renames HEAD^1 HEAD \
            | .github/helper/changed-tests.sh server >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bench
        with:
          site: frappe.local
          db-root-password: root
          site-config: '{"allow_tests": true, "block_endpoints": 1}'

      - name: Run tests
        if: steps.select.outputs.mode != 'subset'
        working-directory: /home/runner/frappe-bench
        run: bench --site frappe.local run-tests --app lms --coverage

      - name: Run changed tests
        if: steps.select.outputs.mode == 'subset'
        working-directory: /home/runner/frappe-bench
        env:
          MODULES: ${{ steps.select.outputs.tests }}
        run: |
          failed=0
          for module in $MODULES; do
            echo "::group::$module"
            bench --site frappe.local run-tests --app lms --module "$module" \
              || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      # A partial run would report most of lms as uncovered.
      - name: Upload coverage data
        if: steps.select.outputs.mode != 'subset'
        uses: codecov/codecov-action@v5
        with:
          name: Server
          token: ${{ secrets.CODECOV_TOKEN }}
          files: /home/runner/frappe-bench/sites/coverage.xml
          # Coverage upload is informational; don't hard-fail CI when Codecov's
          # CLI GPG-key fetch flakes or when a fork PR has no CODECOV_TOKEN.
          fail_ci_if_error: false
          verbose: true
