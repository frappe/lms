name: Server Tests
on:
  push:
    branches:
      - main
      - develop
      - main-hotfix
    paths-ignore:
      - "**.md"
      - "lms/locale/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "lms/locale/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      mariadb:
        image: anandology/mariadb-utf8mb4:10.3
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bench
        with:
          site: frappe.local
          db-root-password: root
          site-config: '{"allow_tests": true, "block_endpoints": 1}'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site frappe.local run-tests --app lms --coverage

      - name: Upload coverage data
        uses: codecov/codecov-action@v5
        with:
          name: Server
          token: ${{ secrets.CODECOV_TOKEN }}
          files: /home/runner/frappe-bench/sites/coverage.xml
          # Coverage upload is informational; don't hard-fail CI when Codecov's
          # CLI GPG-key fetch flakes or when a fork PR has no CODECOV_TOKEN.
          fail_ci_if_error: false
          verbose: true
