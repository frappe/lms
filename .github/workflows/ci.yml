name: Server Tests
on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!lms/locale/**"
      - "!frontend/**"
      - "!**.vue"
      - "!**.ts"
      - "!**.js"
      - "!**.css"
      - "frontend/src/utils/lessonForm.ts"
      - "frontend/src/directives/safeHtmlLevels.ts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      # Pull requests into develop and the hotfix branches skip this suite: it runs every hour
      # on the branch instead (branch-status.yml on develop), and on the release pull request.
      # A label runs it on one pull request. Labels are read live, so a re-run sees a new one.
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')
          has() { jq -e --arg l "$1" 'index($l) != null' <<<"$labels" >/dev/null; }
          full=false
          if has all-tests || has fixes-develop; then full=true; fi
          run=true
          if [ "$BASE" = develop ] || [[ "$BASE" == *-hotfix ]]; then
            run=false
            if has "Run Server Tests" || has fixes-develop; then run=true; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Base $BASE, labels $labels: run=$run full=$full"

  tests:
    name: Server Tests
    needs: plan
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || needs.plan.outputs.run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      mariadb:
        image: anandology/mariadb-utf8mb4:10.3
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      # Depth 2 keeps the PR base, the merge commit's first parent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Select tests
        id: select
        if: >-
          github.event_name == 'pull_request' &&
          needs.plan.outputs.full != 'true'
        run: |
          set -euo pipefail
          git diff --name-status --no-renames HEAD^1 HEAD \
            | .github/helper/changed-tests.sh server >> "$GITHUB_OUTPUT"

      - name: Setup Pilot bench
        shell: bash
        env:
          FRAPPE_BRANCH: develop
          SITE: frappe.local
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Install app under test
        shell: bash
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          pilot get-app "${GITHUB_WORKSPACE}" --branch "${GITHUB_SHA}" --skip-assets
          pilot install-app frappe.local lms

      - name: Run tests
        if: steps.select.outputs.mode != 'subset'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: pilot frappe --site frappe.local run-tests --app lms --coverage

      - name: Run changed tests
        if: steps.select.outputs.mode == 'subset'
        working-directory: /home/runner/pilot/benches/frappe-bench
        env:
          MODULES: ${{ steps.select.outputs.tests }}
        run: |
          failed=0
          for module in $MODULES; do
            echo "::group::$module"
            pilot frappe --site frappe.local run-tests --app lms --module "$module" \
              || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      # A partial run would report most of lms as uncovered.
      - name: Upload coverage data
        if: steps.select.outputs.mode != 'subset'
        uses: codecov/codecov-action@v5
        with:
          name: Server
          token: ${{ secrets.CODECOV_TOKEN }}
          files: /home/runner/pilot/benches/frappe-bench/sites/coverage.xml
          # Coverage upload is informational; don't hard-fail CI when Codecov's
          # CLI GPG-key fetch flakes or when a fork PR has no CODECOV_TOKEN.
          fail_ci_if_error: false
          verbose: true
