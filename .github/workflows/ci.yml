name: Server Tests
on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!lms/locale/**"
      - "!frontend/**"
      - "!**.vue"
      - "!**.ts"
      - "!**.js"
      - "!**.css"
      - "frontend/src/utils/lessonForm.ts"
      - "frontend/src/directives/safeHtmlLevels.ts"
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the experimental pilot e2e job instead of server tests
        type: boolean
        default: false
      spec:
        description: Single e2e spec file to run (empty runs the whole suite)
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      # Pull requests into develop and the hotfix branches skip this suite: it runs every hour
      # on the branch instead (branch-status.yml on develop), and on the release pull request.
      # A label runs it on one pull request. Labels are read live, so a re-run sees a new one.
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')
          has() { jq -e --arg l "$1" 'index($l) != null' <<<"$labels" >/dev/null; }
          full=false
          if has all-tests || has fixes-develop; then full=true; fi
          run=true
          if [ "$BASE" = develop ] || [[ "$BASE" == *-hotfix ]]; then
            run=false
            if has "Run Server Tests" || has fixes-develop; then run=true; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Base $BASE, labels $labels: run=$run full=$full"

  tests:
    name: Server Tests
    needs: plan
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || needs.plan.outputs.run == 'true') &&
      inputs.e2e != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      mariadb:
        image: anandology/mariadb-utf8mb4:10.3
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      # Depth 2 keeps the PR base, the merge commit's first parent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Select tests
        id: select
        if: >-
          github.event_name == 'pull_request' &&
          needs.plan.outputs.full != 'true'
        run: |
          set -euo pipefail
          git diff --name-status --no-renames HEAD^1 HEAD \
            | .github/helper/changed-tests.sh server >> "$GITHUB_OUTPUT"

